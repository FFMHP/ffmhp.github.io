<title>FFM Chuyển Đơn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working column — controls strip on top, one result card per order below */
:root{
  --bg:#f5f4f1; --surface:#ffffff; --line:#e3ded6; --fg:#22201c; --muted:#6f6a61;
  --accent:#c4621c; --accent-fg:#ffffff; --accent-soft:#fbeadb;
  --ok:#2e7d4f; --ok-soft:#e3f2e8; --warn:#9a6a00; --warn-soft:#fdf2d3; --err:#b3261e; --err-soft:#fbe4e1;
  --f-body:"Be Vietnam Pro",system-ui,"Segoe UI",Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1916; --surface:#24221e; --line:#3a3731; --fg:#ece8e1; --muted:#a39d92;
  --accent:#e98a45; --accent-fg:#1a1916; --accent-soft:#3d2a1b;
  --ok:#7fcf9c; --ok-soft:#1f3327; --warn:#e6c25a; --warn-soft:#3a3118; --err:#f19a90; --err-soft:#3f2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1916; --surface:#24221e; --line:#3a3731; --fg:#ece8e1; --muted:#a39d92;
  --accent:#e98a45; --accent-fg:#1a1916; --accent-soft:#3d2a1b;
  --ok:#7fcf9c; --ok-soft:#1f3327; --warn:#e6c25a; --warn-soft:#3a3118; --err:#f19a90; --err-soft:#3f2220; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:1.6rem;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:0;font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.controls{display:grid;grid-template-columns:minmax(180px,230px) minmax(160px,190px) 1fr auto;gap:16px;align-items:stretch}
@media (max-width:860px){.controls{grid-template-columns:1fr 1fr}}@media (max-width:560px){.controls{grid-template-columns:1fr}}
label.k{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:6px}
select,input[type=text],input[type=date]{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 10px}
select:focus-visible,input:focus-visible,button:focus-visible,.drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;min-height:64px;background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-weight:600}.drop small{color:var(--muted);display:block}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:.8rem;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;font-weight:600;border-radius:7px;padding:10px 18px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
.go{display:flex;flex-direction:column;justify-content:flex-end}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.summary{color:var(--muted);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:clip}
.card-h{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:1rem;margin:0;font-family:var(--f-mono);font-weight:500;word-break:break-all}
.src{color:var(--muted);font-size:.8rem;word-break:break-all}
.pill{font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.err{background:var(--err-soft);color:var(--err)}
.pill.demo{background:var(--accent-soft);color:var(--accent)}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:14px 18px}
@media (max-width:760px){.fields{grid-template-columns:1fr 1fr}}
.fields .ro{padding:9px 0;font-weight:500}
.issues{margin:0 18px 12px;padding:0;list-style:none;display:grid;gap:6px}
.issues li{padding:7px 12px;border-radius:6px;font-size:.88rem}
.issues .err{background:var(--err-soft);color:var(--err)}.issues .warn{background:var(--warn-soft);color:var(--warn)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 18px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--bg)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.mono{font-family:var(--f-mono);white-space:nowrap}
tr.err td{background:var(--err-soft)}tr.warn td{background:var(--warn-soft)}
td .flag{display:block;font-size:.78rem;font-weight:500}
tr.err .flag{color:var(--err)}tr.warn .flag{color:var(--warn)}td .flag.info{color:var(--muted)}
tfoot td{font-weight:600}
input.cell{width:100%;min-width:9ch;font:inherit;font-family:var(--f-mono);padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--fg)}
input.cell.ok{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}input.cell.bad{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
td.num input.cell{text-align:right;min-width:5ch;max-width:8ch}
.sub2{font-size:.8rem;color:var(--muted)}
button.small{padding:6px 10px;font-size:.85rem}
select.cell{font-family:var(--f-body);min-width:16ch}
.pname{font-weight:500;margin-bottom:4px}
.rowimg{display:block;max-width:100%;height:auto;max-height:44px;border:1px solid var(--line);border-radius:4px;margin-bottom:4px;background:#fff}
.issues .info{background:var(--bg);color:var(--muted)}
.card-f{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line)}
.why{margin:12px 18px 0;padding:10px 12px;border-radius:6px;background:var(--err-soft);color:var(--err);font-size:.9rem;font-weight:500}
.card-act{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.issues.top{margin-top:12px}
.card-h{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--surface)}
.out{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);word-break:break-all}
.toast{min-height:1.4em;font-size:.88rem;color:var(--muted)}
.toast.err{color:var(--err)}.toast.ok{color:var(--ok)}
.note{font-size:.85rem;color:var(--muted)}
.list{display:grid;gap:16px}
@media (prefers-reduced-motion:no-preference){button{transition:filter .15s}button:not(:disabled):hover{filter:brightness(1.06)}}
</style>
